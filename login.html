<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Wireless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; position: relative; overflow: hidden; }

    body::before {
      content: '';
      position: fixed; top: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(204,0,0,0.1) 0%, transparent 65%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; bottom: -150px; left: -150px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(204,0,0,0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: #0f0f0f; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px; padding: 2.5rem 2rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo { display: flex; align-items: center; gap: 0.55rem; text-decoration: none; margin-bottom: 2rem; justify-content: center; }
    .logo img { height: 36px; }
    .logo span { font-weight: 700; font-size: 1.25rem; color: #fff; text-transform: lowercase; letter-spacing: -0.03em; }

    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; text-align: center; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
    .sub { font-size: 0.85rem; color: rgba(255,255,255,0.4); text-align: center; margin-bottom: 1.75rem; }
    .sub a { color: oklch(var(--primary-500)); text-decoration: none; font-weight: 500; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 0.4rem; }
    input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 0.72rem 0.9rem; color: #fff; font-size: 0.875rem;
      font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: rgba(204,0,0,0.55); }
    input::placeholder { color: rgba(255,255,255,0.22); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.5rem; }
    .pw-toggle {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3);
      font-size: 1rem; padding: 0; display: flex; align-items: center;
    }
    .pw-toggle:hover { color: rgba(255,255,255,0.65); }

    .form-error {
      display: none; background: rgba(204,0,0,0.1); border: 1px solid rgba(204,0,0,0.3);
      color: #ff6666; font-size: 0.8rem; padding: 0.6rem 0.85rem; border-radius: 7px;
      margin-bottom: 1rem; align-items: center; gap: 0.5rem;
    }
    .form-error.visible { display: flex; }

    .btn-submit {
      width: 100%; background: oklch(var(--primary-500)); color: #fff; font-weight: 700;
      font-size: 0.925rem; padding: 0.85rem; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: oklch(var(--primary-700)); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer-links { margin-top: 1.25rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .footer-links a { font-size: 0.8rem; color: rgba(255,255,255,0.35); text-decoration: none; }
    .footer-links a:hover { color: rgba(255,255,255,0.65); }

    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
    .divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.07); }
    .divider span { font-size: 0.72rem; color: rgba(255,255,255,0.25); }

    .btn-create {
      width: 100%; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); font-weight: 600;
      font-size: 0.875rem; padding: 0.8rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      cursor: pointer; font-family: inherit; transition: background 0.15s; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-create:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="card">
    <a href="./index.html" class="logo">
      <img src="./assets/images/logo-mark.png" alt="">
      <span>wireless</span>
    </a>

    <h1>Welcome back</h1>
    <p class="sub">Don't have an account? <a href="./signup.html">Sign up free →</a></p>

    <div class="form-error" id="login-error">
      <i class="ph ph-warning-circle"></i>
      <span id="login-error-msg"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="john@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password">
            <i class="ph ph-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="login-btn">
        <i class="ph ph-sign-in"></i> Sign In
      </button>
    </form>

    <div class="divider"><hr><span>or</span><hr></div>
    <a href="./signup.html" class="btn-create"><i class="ph ph-user-plus"></i> Create a free account</a>

    <div class="footer-links">
      <a href="./index.html">← Back to Wireless</a>
    </div>
  </div>

<script type="module">
  import { login } from './assets/js/auth.js';

  document.getElementById('pw-toggle').addEventListener('click', () => {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    const show = inp.type === 'password';
    inp.type   = show ? 'text' : 'password';
    icon.className = show ? 'ph ph-eye-slash' : 'ph ph-eye';
  });

  const form   = document.getElementById('login-form');
  const errBox = document.getElementById('login-error');
  const errMsg = document.getElementById('login-error-msg');
  const btn    = document.getElementById('login-btn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    errBox.classList.remove('visible');

    const email    = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
      errMsg.textContent = 'Please enter your email and password.';
      return errBox.classList.add('visible');
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-circle-notch"></i> Signing in…';

    const result = login(email, password);

    if (result.error) {
      btn.disabled = false;
      btn.innerHTML = '<i class="ph ph-sign-in"></i> Sign In';
      errMsg.textContent = result.error;
      return errBox.classList.add('visible');
    }

    const params = new URLSearchParams(location.search);
    const next   = sessionStorage.getItem('wl_next');
    sessionStorage.removeItem('wl_next');
    location.href = (params.get('next') === 'booking' || next) ? './contact.html' : './index.html';
  });
</script>
</body>
</html>
